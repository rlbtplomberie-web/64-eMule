name: Build 64 eMule Skin64 V5 Animation Rotation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v5

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Telecharger la base verrouillee
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mupen64plus-ae/mupen64plus-ae.git m64base
          git -C m64base checkout 33bf7021549d7873e976884370fbd1a8e7333bc7

      - name: Installer Skin64 V5
        run: |
          set -euo pipefail
          test -f 64-eMule-Skin64-V5.zip
          mkdir -p package-v5
          unzip -q 64-eMule-Skin64-V5.zip -d package-v5
          marker=$(find package-v5 -type f -name SKIN64_EMULE_V5 -print -quit)
          test -n "$marker"
          cp -a "$(dirname "$marker")"/. m64base/

      - name: Configurer Android
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > m64base/local.properties

      - name: Verifier animation tactile et rotation
        run: |
          set -euo pipefail
          for pad in portrait paysage paysage2 paysage_touches; do
            test -f "m64base/app/src/main/assets/skinn64/$pad/positions.json"
          done
          map=m64base/app/src/main/java/paulscode/android/mupen64plusae/input/map/SkinN64TouchMap.java
          game=m64base/app/src/main/java/paulscode/android/mupen64plusae/game/GameActivity.java
          manifest=m64base/app/src/main/AndroidManifest.xml
          grep -q 'updatePressed(MotionEvent' "$map"
          grep -q 'hit("etoile"' "$map"
          grep -q 'sourceMargins' "$map"
          grep -q 'SCREEN_ORIENTATION_FULL_SENSOR' "$game"
          grep -q 'onConfigurationChanged' "$game"
          grep -q 'orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden' "$manifest"
          test -f m64base/app/src/main/res/layout/game_activity.xml

      - name: Compiler APK
        working-directory: m64base
        run: ./gradlew :app:clean :app:assembleDebug --no-daemon --stacktrace --no-build-cache

      - name: Preparer APK
        run: |
          set -euo pipefail
          mkdir -p apk-result
          apk=$(find m64base/app/build/outputs/apk -type f -name '*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" apk-result/64-eMule-Skin64-V5.apk

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: 64-eMule-Skin64-V5
          path: apk-result/64-eMule-Skin64-V5.apk
          if-no-files-found: error
